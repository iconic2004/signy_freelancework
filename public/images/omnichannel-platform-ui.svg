    <!-- Row 1 -->
    <line x1="94" y1="294" x2="506" y2="294" stroke="#F1F5F9"/>
    <rect x="94" y="260" width="28" height="28" rx="6" fill="#F0FDF4"/>
    <circle cx="108" cy="274" r="5" fill="#22C55E"/>
    <text x="132" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">WhatsApp Business • Order Update Dispatched</text>
    <text x="132" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Recipient: +91 98402XXXXX • DLT Template: WABA_ORD_01</text>
    <rect x="440" y="264" width="66" height="20" rx="10" fill="#DCFCE7"/>
    <text x="473" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">DELIVERED</text>

    <!-- Row 2 -->
    <line x1="94" y1="344" x2="506" y2="344" stroke="#F1F5F9"/>
    <rect x="94" y="310" width="28" height="28" rx="6" fill="#EFF6FF"/>
    <circle cx="108" cy="324" r="5" fill="#3B82F6"/>
    <text x="132" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Google Verified SMS • Two-Factor Auth Code</text>
    <text x="132" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Recipient: +91 97110XXXXX • Verified by Google Security</text>
    <rect x="440" y="314" width="66" height="20" rx="10" fill="#DCFCE7"/>
    <text x="473" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">VERIFIED</text>

    <!-- Row 3 -->
    <line x1="94" y1="394" x2="506" y2="394" stroke="#F1F5F9"/>
    <rect x="94" y="360" width="28" height="28" rx="6" fill="#FDF2F8"/>
    <circle cx="108" cy="374" r="5" fill="#EC4899"/>
    <text x="132" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">RCS Rich Messaging • Festive Promotional Card</text>
    <text x="132" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Recipient: +91 98118XXXXX • Action Chip Clicked</text>
    <rect x="440" y="364" width="66" height="20" rx="10" fill="#FDF2F8"/>
    <text x="473" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#BE185D" text-anchor="middle">ENGAGED</text>

    <!-- Row 4 -->
    <rect x="94" y="410" width="28" height="28" rx="6" fill="#F5F3FF"/>
    <circle cx="108" cy="424" r="5" fill="#8B5CF6"/>
    <text x="132" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">AI Chatbot • Customer Return Inquiry Resolved</text>
    <text x="132" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Channel: Web Widget • Duration: 14s • CSAT: 5/5</text>
    <rect x="440" y="414" width="66" height="20" rx="10" fill="#DCFCE7"/>
    <text x="473" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">RESOLVED</text>
  </g>
</svg>
