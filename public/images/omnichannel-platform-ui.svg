<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowOmni" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#shadowOmni)">
    <!-- Main Dashboard Card Frame -->
    <rect x="50" y="30" width="500" height="440" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Header -->
    <path d="M 50 54 Q 50 30 74 30 L 526 30 Q 550 30 550 54 L 550 84 L 50 84 Z" fill="#F8FAFC"/>
    <circle cx="78" cy="57" r="5" fill="#EF4444"/>
    <circle cx="94" cy="57" r="5" fill="#F59E0B"/>
    <circle cx="110" cy="57" r="5" fill="#10B981"/>

    <text x="134" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Signy Enterprise Messaging Suite</text>

    <rect x="410" y="46" width="122" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="422" cy="58" r="4" fill="#10B981"/>
    <text x="432" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#047857">GATEWAYS HEALTHY</text>

    <!-- Channels Throughput Bar -->
    <rect x="74" y="100" width="452" height="106" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="94" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Unified Communication Channels Real-Time Dispatch</text>

    <!-- Channel Pill 1: WhatsApp -->
    <rect x="94" y="136" width="98" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="106" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803D">WhatsApp API</text>
    <text x="106" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0F172A">1.2M <tspan font-size="9" font-weight="500" fill="#64748B">msgs</tspan></text>
    <text x="106" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#15803D">99.8% Read</text>

    <!-- Channel Pill 2: Bulk SMS -->
    <rect x="200" y="136" width="98" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="212" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284C7">Bulk SMS / DLT</text>
    <text x="212" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0F172A">4.8M <tspan font-size="9" font-weight="500" fill="#64748B">msgs</tspan></text>
    <text x="212" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#15803D">99.9% Deliv</text>

    <!-- Channel Pill 3: RCS -->
    <rect x="306" y="136" width="98" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="318" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#DB2777">RCS Messaging</text>
    <text x="318" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0F172A">650K <tspan font-size="9" font-weight="500" fill="#64748B">msgs</tspan></text>
    <text x="318" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#15803D">3.4x CTR</text>

    <!-- Channel Pill 4: Voice & IVR -->
    <rect x="412" y="136" width="98" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="424" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#7C3AED">Voice &amp; IVR</text>
    <text x="424" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0F172A">340K <tspan font-size="9" font-weight="500" fill="#64748B">calls</tspan></text>
    <text x="424" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#15803D">98.9% Pick</text>

    <!-- Live Event Feed Table -->
