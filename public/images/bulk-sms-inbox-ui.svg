<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowSMSInbox" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#shadowSMSInbox)">
    <!-- Phone Outer Body -->
    <rect x="130" y="20" width="340" height="460" rx="36" fill="#0F172A"/>
    <!-- Phone Inner Bezel -->
    <rect x="134" y="24" width="332" height="452" rx="32" fill="#1E293B"/>
    <!-- Screen Area -->
    <rect x="138" y="28" width="324" height="444" rx="28" fill="#FFFFFF"/>

    <!-- Status Bar / Dynamic Notch -->
    <rect x="240" y="34" width="120" height="18" rx="9" fill="#0F172A"/>

    <!-- SMS App Header -->
    <rect x="138" y="28" width="324" height="72" rx="28" fill="#FFFFFF"/>
    <text x="162" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Messages</text>
    
    <!-- Search Icon -->
    <circle cx="434" cy="70" r="7" stroke="#64748B" stroke-width="1.8" fill="none"/>
    <path d="M 439 75 L 444 80" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Notification 1: Transactional Bank Alert -->
    <rect x="150" y="106" width="300" height="80" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="178" cy="146" r="16" fill="#EFF6FF"/>
    <text x="178" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">TX</text>
    <text x="204" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">VM-ICICIBK</text>
    <text x="410" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">2m ago</text>
    <text x="204" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Acct XX4829 credited with INR 18,500.00</text>
    <text x="204" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">Ref: UPI/3910482910/Salary. Available Bal: INR 94,210.00</text>

    <!-- Notification 2: E-Commerce Delivery Dispatch -->
    <rect x="150" y="196" width="300" height="80" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="178" cy="236" r="16" fill="#F0FDF4"/>
    <text x="178" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#16A34A" text-anchor="middle">DL</text>
    <text x="204" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">VK-SIGNYEX</text>
    <text x="410" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">14m ago</text>
    <text x="204" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Out for delivery: Package from Nike India</text>
    <text x="204" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">Rider: Rajesh (98104XXXXX). Share OTP: 4910 at doorstep.</text>

    <!-- Notification 3: Security Verification OTP -->
    <rect x="150" y="286" width="300" height="80" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="178" cy="326" r="16" fill="#FEF3C7"/>
    <text x="178" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">OTP</text>
    <text x="204" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">BP-SIGNYSEC</text>
    <text x="410" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">1h ago</text>
    <text x="204" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Your one-time password is 628419</text>
    <text x="204" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">Valid for 5 mins. Signy will never ask for your password.</text>

    <!-- Notification 4: Promotional Broadcast -->
    <rect x="150" y="376" width="300" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="178" cy="414" r="16" fill="#FCE7F3"/>
    <text x="178" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#BE185D" text-anchor="middle">PR</text>
    <text x="204" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">AD-DOMINOS</text>
    <text x="410" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">3h ago</text>
    <text x="204" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#334155">Weekend Special: Buy 1 Get 1 Free Cheese Burst Pizza!</text>
    <text x="204" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">Use code PIZZA50 on Domino&apos;s app. T&amp;C apply.</text>
  </g>
</svg>
