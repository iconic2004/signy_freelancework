<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowSocial" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#shadowSocial)">
    <rect x="50" y="30" width="500" height="440" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Header -->
    <text x="80" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Social Media Performance &amp; Campaign Suite</text>
    <text x="80" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Multi-platform engagement analytics, follower conversions, and scheduled editorial flow</text>

    <!-- Top KPI Cards Row -->
    <rect x="80" y="112" width="136" height="74" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="94" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748B">TOTAL REACH</text>
    <text x="94" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">1.84M</text>
    <text x="94" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#15803D">+34% vs last month</text>

    <rect x="232" y="112" width="136" height="74" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="246" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#166534">ENGAGEMENT RATE</text>
    <text x="246" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#15803D">8.4%</text>
    <text x="246" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#15803D">3.2x industry avg</text>

    <rect x="384" y="112" width="136" height="74" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="398" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748B">CLICK CONVERSIONS</text>
    <text x="398" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">42.8K</text>
    <text x="398" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0284C7">High intent traffic</text>

    <!-- Center Left: Follower Growth Trend Graph -->
    <rect x="80" y="202" width="260" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="96" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Audience Growth Trajectory</text>
    <text x="96" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">Aggregated LinkedIn, Meta &amp; Instagram</text>

    <!-- Graph Axes & Grid lines -->
    <line x1="96" y1="280" x2="320" y2="280" stroke="#E2E8F0" stroke-dasharray="3 3"/>
    <line x1="96" y1="330" x2="320" y2="330" stroke="#E2E8F0" stroke-dasharray="3 3"/>
    <line x1="96" y1="380" x2="320" y2="380" stroke="#E2E8F0" stroke-dasharray="3 3"/>

    <!-- Upward Trend Line -->
    <path d="M 104 390 Q 140 370 170 340 T 230 290 T 280 250 T 320 230" fill="none" stroke="#4ABFAD" stroke-width="3" stroke-linecap="round"/>
    <!-- Shaded area below curve -->
    <path d="M 104 390 Q 140 370 170 340 T 230 290 T 280 250 T 320 230 L 320 400 L 104 400 Z" fill="#4ABFAD" fill-opacity="0.1"/>

    <!-- Key Milestone Tag -->
    <rect x="250" y="224" width="70" height="20" rx="6" fill="#0F172A"/>
    <text x="285" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">+142% MoM</text>

    <!-- Months Label -->
    <text x="110" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Jan</text>
    <text x="160" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Feb</text>
    <text x="210" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Mar</text>
    <text x="260" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Apr</text>
    <text x="310" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0F172A">May</text>

    <!-- Center Right: Scheduled Post Previews -->
    <rect x="352" y="202" width="168" height="240" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="366" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Editorial Calendar</text>

    <!-- Post Item 1 -->
    <rect x="366" y="242" width="140" height="54" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="382" cy="258" r="8" fill="#EFF6FF"/>
    <text x="382" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">in</text>
    <text x="398" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">B2B Case Study</text>
    <text x="398" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#166534">Published • 12.4K views</text>
    <rect x="398" y="278" width="56" height="12" rx="4" fill="#DCFCE7"/>
    <text x="426" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="middle">Engaged</text>

    <!-- Post Item 2 -->
    <rect x="366" y="304" width="140" height="54" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="382" cy="320" r="8" fill="#FDF2F8"/>
    <text x="382" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#DB2777" text-anchor="middle">ig</text>
    <text x="398" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">Feature Reel</text>
    <text x="398" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Scheduled • 5:00 PM</text>
    <rect x="398" y="340" width="56" height="12" rx="4" fill="#E0F2FE"/>
    <text x="426" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#0284C7" text-anchor="middle">Queued</text>

    <!-- Post Item 3 -->
    <rect x="366" y="366" width="140" height="54" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="382" cy="382" r="8" fill="#F0FDF4"/>
    <text x="382" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#16A34A" text-anchor="middle">wa</text>
    <text x="398" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">Broadcast Story</text>
    <text x="398" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569">Draft Review</text>
  </g>
</svg>
