<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowBot" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#shadowBot)">
    <!-- Chat Widget Outer Frame -->
    <rect x="110" y="24" width="380" height="452" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Chat Widget Header -->
    <path d="M 110 48 Q 110 24 134 24 L 466 24 Q 490 24 490 48 L 490 92 L 110 92 Z" fill="#0F172A"/>

    <!-- Bot Avatar with Green Live Dot -->
    <circle cx="146" cy="58" r="18" fill="#1E293B"/>
    <!-- Clean Sparkle / AI Assistant Icon -->
    <path d="M 146 50 L 148 55 L 153 57 L 148 59 L 146 64 L 144 59 L 139 57 L 144 55 Z" fill="#4ABFAD"/>
    <circle cx="158" cy="68" r="4.5" fill="#10B981" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Header Name & Live Status -->
    <text x="176" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Signy AI Assistant</text>
    <text x="176" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Always Online • Instant Responses</text>

    <!-- Header Controls -->
    <circle cx="446" cy="58" r="2.5" fill="#64748B"/>
    <circle cx="456" cy="58" r="2.5" fill="#64748B"/>
    <circle cx="466" cy="58" r="2.5" fill="#64748B"/>

    <!-- Chat Body Canvas -->
    <rect x="110" y="92" width="380" height="326" fill="#F8FAFC"/>

    <!-- Message 1: Bot Greeting -->
    <rect x="130" y="112" width="280" height="72" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="144" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Hello! 👋 Welcome to Signy Support.</text>
    <text x="144" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">I can help you monitor live SMS gateways, track campaign deliveries, or connect with a specialist.</text>
    <text x="365" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94A3B8">Just now</text>

    <!-- Quick Selection Chips from Bot -->
    <rect x="130" y="194" width="138" height="28" rx="14" fill="#FFFFFF" stroke="#4ABFAD"/>
    <text x="199" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="middle">Check System Uptime</text>

    <rect x="274" y="194" width="124" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="336" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">API Documentation</text>

    <rect x="130" y="228" width="144" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="202" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Speak with Specialist</text>

    <!-- Message 2: User Selected Option (Right Aligned, Teal Bubble) -->
    <rect x="260" y="270" width="210" height="38" rx="14" fill="#4ABFAD"/>
    <text x="274" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Check System Uptime</text>
    <text x="440" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#E0F2FE">10:42</text>

    <!-- Message 3: Bot Dynamic Real-time Answer with Metrics Card -->
    <rect x="130" y="320" width="310" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="144" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0F172A">All systems operational! 🚀</text>
    <rect x="144" y="348" width="282" height="44" rx="8" fill="#F0FDF4" stroke="#DCFCE7"/>
    <text x="156" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#15803D">99.99% Uptime across all Carrier Trunks</text>
    <text x="156" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#166534">Avg Latency: 22ms • Zero degraded services</text>
    <text x="395" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94A3B8">10:42</text>

    <!-- Bottom Typing & Send Input Area -->
    <rect x="110" y="418" width="380" height="58" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="126" y="430" width="298" height="34" rx="17" fill="#F1F5F9"/>
    <text x="144" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">Ask a question or type a message...</text>
    <circle cx="452" cy="447" r="16" fill="#4ABFAD"/>
    <path d="M 447 447 L 455 442 L 455 452 Z" fill="#FFFFFF"/>
  </g>
</svg>
