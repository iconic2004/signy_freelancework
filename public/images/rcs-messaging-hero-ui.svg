<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowR" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#shadowR)">
    <!-- Phone Outer Body -->
    <rect x="130" y="20" width="340" height="460" rx="36" fill="#0F172A"/>
    <!-- Phone Inner Bezel -->
    <rect x="134" y="24" width="332" height="452" rx="32" fill="#1E293B"/>
    <!-- Screen Area -->
    <rect x="138" y="28" width="324" height="444" rx="28" fill="#F8FAFC"/>

    <!-- Android Status Bar / Notch -->
    <rect x="240" y="34" width="120" height="18" rx="9" fill="#0F172A"/>

    <!-- RCS Header -->
    <rect x="138" y="28" width="324" height="66" rx="28" fill="#FFFFFF"/>
    <!-- Back arrow -->
    <path d="M 154 68 L 162 60 M 154 68 L 162 76 M 154 68 L 170 68" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Brand Avatar -->
    <circle cx="190" cy="68" r="16" fill="#FCE7F3" stroke="#FBCFE8"/>
    <text x="190" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#DB2777" text-anchor="middle">R</text>

    <!-- Sender Name & RCS Rich Badge -->
    <text x="214" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Retail Pro Brand</text>

    <!-- Verified Badge -->
    <circle cx="320" cy="60" r="6" fill="#EC4899"/>
    <path d="M 317.5 60 L 319.5 62 L 322.5 58.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="214" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#DB2777">RCS Verified Business</text>

    <!-- Phone Call & Menu -->
    <circle cx="430" cy="68" r="12" fill="#F1F5F9"/>
    <path d="M 426 64 C 426 71 428 73 434 73" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Timestamp -->
    <text x="300" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle">RCS Chat with Retail Pro • 12:40 PM</text>

    <!-- Rich Card Hero (Interactive RCS Carousel Card) -->
    <rect x="154" y="124" width="292" height="236" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <!-- Rich Media Banner Header Inside Card -->
    <rect x="154" y="124" width="292" height="100" rx="16" fill="#F43F5E"/>
    <!-- Clip bottom corners of image header -->
    <rect x="154" y="200" width="292" height="24" fill="#FFFFFF"/>
    
    <!-- Promotional Graphic Content on Media Header -->
    <circle cx="210" cy="174" r="30" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="300" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">EXCLUSIVE FESTIVE DROP</text>
    <rect x="250" y="174" width="100" height="20" rx="10" fill="#FFFFFF"/>
    <text x="300" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#E11D48" text-anchor="middle">FLAT 40% OFF</text>

    <!-- Card Description -->
    <text x="170" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Spring Collection Preview</text>
    <text x="170" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B">Curated apparel &amp; footwear. Free express delivery on orders above ₹999.</text>

    <!-- RCS Action Buttons Inside Card -->
    <rect x="168" y="270" width="264" height="34" rx="8" fill="#FDF2F8" stroke="#FCE7F3"/>
    <text x="300" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#BE185D" text-anchor="middle">Explore Catalog</text>

    <rect x="168" y="312" width="264" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="300" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Find Nearby Store</text>

    <!-- Quick Reply Chips Below Card -->
    <rect x="154" y="372" width="94" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="201" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Track Order</text>

    <rect x="254" y="372" width="102" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="305" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Store Timings</text>

    <rect x="362" y="372" width="84" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="404" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Support</text>

    <!-- Bottom Message Input Bar with RCS indicator -->
    <rect x="150" y="426" width="260" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="168" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">RCS chat message...</text>
    <circle cx="430" cy="443" r="15" fill="#DB2777"/>
    <path d="M 425 443 L 433 438 L 433 448 Z" fill="#FFFFFF"/>
  </g>
</svg>
