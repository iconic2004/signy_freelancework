<svg width="220" height="280" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Signy logo</title>
  <desc>A stacked logo with an abstract pinwheel emblem of three gold petal shapes on top, and the word Signy in navy letters below.</desc>
  <defs>
    <linearGradient id="petalA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C46B"/>
      <stop offset="100%" stop-color="#D98E2B"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A94B"/>
      <stop offset="100%" stop-color="#C77D1F"/>
    </linearGradient>
    <linearGradient id="petalC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D28C"/>
      <stop offset="100%" stop-color="#DE9A3A"/>
    </linearGradient>
  </defs>

  <g transform="translate(110,95)">
    <path d="M 0 0 C -6 -28, -2 -52, 0 -56 C 2 -52, 6 -28, 0 0 Z"
      transform="rotate(0)" fill="url(#petalA)"/>
    <path d="M 0 0 C -6 -28, -2 -52, 0 -56 C 2 -52, 6 -28, 0 0 Z"
      transform="rotate(120)" fill="url(#petalB)"/>
    <path d="M 0 0 C -6 -28, -2 -52, 0 -56 C 2 -52, 6 -28, 0 0 Z"
      transform="rotate(240)" fill="url(#petalC)"/>
    <circle cx="0" cy="0" r="8" fill="#1B2A4A"/>
  </g>

  <text x="110" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="2" fill="#1B2A4A">Signy</text>
</svg>
