<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowG" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Phone Container -->
  <g filter="url(#shadowG)">
    <!-- Phone Outer Body -->
    <rect x="130" y="20" width="340" height="460" rx="36" fill="#0F172A"/>
    <!-- Phone Inner Bezel -->
    <rect x="134" y="24" width="332" height="452" rx="32" fill="#1E293B"/>
    <!-- Screen Area -->
    <rect x="138" y="28" width="324" height="444" rx="28" fill="#FFFFFF"/>

    <!-- Google Messages Top Header -->
    <rect x="138" y="28" width="324" height="66" rx="28" fill="#FFFFFF"/>
    <!-- Status Bar / Dynamic Notch -->
    <rect x="240" y="34" width="120" height="18" rx="9" fill="#0F172A"/>

    <!-- Header items -->
    <path d="M 154 68 L 162 60 M 154 68 L 162 76 M 154 68 L 170 68" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

    <!-- Branded Google Verified Sender Avatar -->
    <circle cx="190" cy="68" r="16" fill="#EFF6FF" stroke="#DBEAFE"/>
    <!-- Teal Signy S Mark -->
    <text x="190" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">S</text>

    <!-- Sender Name & Blue Google Verified Badge -->
    <text x="214" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Signy Security</text>

    <!-- Official Google Verified Shield Badge -->
    <g transform="translate(305, 54)">
      <path d="M 8 1 L 15 4 V 9 C 15 13.5 12 17 8 18.5 C 4 17 1 13.5 1 9 V 4 L 8 1 Z" fill="#1A73E8"/>
      <path d="M 5 9.5 L 7 11.5 L 11 7.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="214" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#15803D">Verified by Google</text>

    <!-- Call and Search Icons -->
    <circle cx="418" cy="68" r="7" stroke="#64748B" stroke-width="1.5" fill="none"/>
    <path d="M 423 73 L 427 77" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="442" cy="68" r="2" fill="#64748B"/>
    <circle cx="442" cy="62" r="2" fill="#64748B"/>
    <circle cx="442" cy="74" r="2" fill="#64748B"/>

    <!-- Google Verified Banner Card -->
    <rect x="150" y="102" width="300" height="52" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
    <!-- Green Lock / Shield -->
    <circle cx="170" cy="128" r="12" fill="#DCFCE7"/>
    <path d="M 166 128 L 169 131 L 175 125" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#166534">Authenticity Guaranteed</text>
    <text x="190" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#15803D">Google verified sender identity (signysolutions.com)</text>

    <!-- Timestamp -->
    <text x="300" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle">Today • 11:32 AM</text>

    <!-- Verified SMS Message Bubble -->
    <rect x="150" y="186" width="300" height="150" rx="16" fill="#F1F5F9"/>
    
    <!-- Header of Message: Brand Icon & Official Sender Notice -->
    <rect x="162" y="198" width="276" height="34" rx="8" fill="#FFFFFF"/>
    <circle cx="176" cy="215" r="9" fill="#1A73E8"/>
    <path d="M 173 215 L 175 217 L 179 213" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#1E293B">Official Signy Account Verification</text>

    <text x="162" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Your login OTP is 849-210</text>
    <text x="162" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Use this one-time code to authorize sign-in.</text>
    <text x="162" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569">Valid for 10 minutes. Never share this code.</text>
    <text x="162" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#2563EB">signy.in/auth/verify</text>

    <text x="415" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94A3B8">11:32 AM</text>

    <!-- Rich Link Preview Card -->
    <rect x="150" y="348" width="300" height="68" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="160" y="358" width="48" height="48" rx="10" fill="#EFF6FF"/>
    <path d="M 176 376 L 184 384 M 184 376 L 176 384" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="184" cy="382" r="10" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <text x="216" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Signy Security Center</text>
    <text x="216" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748B">Two-factor identity verification active</text>
    <text x="216" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94A3B8">signysolutions.com</text>

    <!-- Bottom Action Bar -->
    <rect x="150" y="432" width="260" height="32" rx="16" fill="#F1F5F9"/>
    <text x="168" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Chat message</text>
    <circle cx="428" cy="448" r="14" fill="#1A73E8"/>
    <path d="M 423 448 L 431 443 L 431 453 Z" fill="#FFFFFF"/>
  </g>
</svg>
